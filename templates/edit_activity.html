{% extends "base.html" %}

{% block title %}Edit Activity - Life Audit Platform{% endblock %}

{% block content %}
<section class="activity-page">
    <div class="activity-box">
        <h1>Edit Activity</h1>
        <p>Update your saved daily activity record.</p>

        <form method="POST" class="activity-form">
            <div class="form-group">
                <label for="sleep_hours">Sleep Hours</label>
                <input type="number" step="0.1" name="sleep_hours" id="sleep_hours" value="{{ activity.sleep_hours }}" required>
            </div>

            <div class="form-group">
                <label for="work_hours">Study/Work Hours</label>
                <input type="number" step="0.1" name="work_hours" id="work_hours" value="{{ activity.work_hours }}" required>
            </div>

            <div class="form-group">
                <label for="mobile_hours">Mobile Usage Hours</label>
                <input type="number" step="0.1" name="mobile_hours" id="mobile_hours" value="{{ activity.mobile_hours }}" required>
            </div>

            <div class="form-group">
                <label for="exercise_hours">Exercise Hours</label>
                <input type="number" step="0.1" name="exercise_hours" id="exercise_hours" value="{{ activity.exercise_hours }}" required>
            </div>

            <div class="form-group">
                <label for="mood">Mood</label>
                <select name="mood" id="mood" required>
                    <option value="Excellent" {% if activity.mood == 'Excellent' %}selected{% endif %}>Excellent</option>
                    <option value="Good" {% if activity.mood == 'Good' %}selected{% endif %}>Good</option>
                    <option value="Average" {% if activity.mood == 'Average' %}selected{% endif %}>Average</option>
                    <option value="Low" {% if activity.mood == 'Low' %}selected{% endif %}>Low</option>
                    <option value="Very Low" {% if activity.mood == 'Very Low' %}selected{% endif %}>Very Low</option>
                </select>
            </div>

            <div class="form-group">
                <label for="notes">Notes</label>
                <textarea name="notes" id="notes" rows="5">{{ activity.notes }}</textarea>
            </div>

            <button type="submit" class="submit-btn">Update Activity</button>
        </form>
    </div>
</section>
{% endblock %}
