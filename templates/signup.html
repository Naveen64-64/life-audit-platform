{% extends "base.html" %}

{% block title %}Signup{% endblock %}

{% block content %}
<div class="auth-container">
    <h2>Create Account</h2>
    <form method="POST" class="auth-form" id="authForm" data-auth-mode="signup">
        <input type="text" name="name" placeholder="Full Name" required>
        <input type="email" name="email" placeholder="Email Address" required>
        <input type="password" name="password" placeholder="Password" required>
        <label class="auth-avatar-label">Choose an avatar</label>
        <div class="avatar-picker-grid auth-avatar-picker">
            {% for avatar in avatar_options %}
                <label class="avatar-option">
                    <input type="radio" name="profile_avatar" value="{{ avatar }}" {% if loop.first %}checked{% endif %} required>
                    <img src="{{ url_for('static', filename=avatar) }}" alt="Avatar option {{ loop.index }}">
                </label>
            {% endfor %}
        </div>
        <button type="submit">Sign Up</button>
    </form>
    <p>Already have an account? <a href="/login">Login</a></p>
</div>
{% endblock %}
