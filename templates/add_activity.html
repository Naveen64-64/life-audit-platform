{% extends "base.html" %}

{% block title %}Add Activity - Life Audit Platform{% endblock %}

{% block content %}
<section class="activity-page">
    <div class="activity-box">
        <div class="activity-top">
            <div>
                <h1>Add Daily Activity</h1>
                <p>Fill in your daily routine details below.</p>
            </div>
            <a href="{{ url_for('activities') }}" class="manage-btn">Manage Activities</a>
        </div>

        <form method="POST" class="activity-form">
            <div class="form-group">
                <label for="sleep_hours">Sleep Hours</label>
                <input type="number" step="0.1" name="sleep_hours" id="sleep_hours" placeholder="Example: 7.5" required>
            </div>

            <div class="form-group">
                <label for="work_hours">Study/Work Hours</label>
                <input type="number" step="0.1" name="work_hours" id="work_hours" placeholder="Example: 6" required>
            </div>

            <div class="form-group">
                <label for="mobile_hours">Mobile Usage Hours</label>
                <input type="number" step="0.1" name="mobile_hours" id="mobile_hours" placeholder="Example: 4" required>
            </div>

            <div class="form-group">
                <label for="exercise_hours">Exercise Hours</label>
                <input type="number" step="0.1" name="exercise_hours" id="exercise_hours" placeholder="Example: 1" required>
            </div>

            <div class="form-group">
                <label for="mood">Mood</label>
                <select name="mood" id="mood" required>
                    <option value="">Select mood</option>
                    <option value="Excellent">Excellent</option>
                    <option value="Good">Good</option>
                    <option value="Average">Average</option>
                    <option value="Low">Low</option>
                    <option value="Very Low">Very Low</option>
                </select>
            </div>

            <div class="form-group">
                <label for="notes">Notes</label>
                <textarea name="notes" id="notes" rows="5" placeholder="Write anything important about your day..."></textarea>
            </div>

            <button type="submit" class="submit-btn">Save Activity</button>
        </form>
    </div>
</section>
{% endblock %}
